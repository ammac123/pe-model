[project]
name = "mortgage-elasticity"
version = "0.1.0"
description = "Bayesian state-space share model for mortgage price elasticity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "pymc>=5.10",
    "nutpie>=0.13",
]

[dependency-groups]
dev = [
    "formulas>=1.2",  # evaluates the exported workbook in tests
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "nbconvert>=7.17.2",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
elasticity = "mortgage_elasticity.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
